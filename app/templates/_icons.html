{#- Inline stroke icons (24px grid, 1.75 stroke). Usage: {{ icon('home') }} -#}
{% macro icon(name, size=20, cls='') -%}
<svg class="i {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' -%}
<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
{%- elif name == 'plug' -%}
<path d="M9 2v6"/><path d="M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8Z"/><path d="M12 17v5"/>
{%- elif name == 'target' -%}
<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
{%- elif name == 'calendar' -%}
<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/><path d="M12 13v3l2 1.5"/>
{%- elif name == 'chart' -%}
<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>
{%- elif name == 'settings' -%}
<path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 12h4"/><path d="M12 12h8"/><circle cx="10" cy="12" r="2"/><path d="M4 18h12"/><circle cx="18" cy="18" r="2"/>
{%- elif name == 'logout' -%}
<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/>
{%- elif name == 'menu' -%}
<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
{%- elif name == 'x' -%}
<path d="M6 6l12 12"/><path d="M18 6 6 18"/>
{%- elif name == 'plus' -%}
<path d="M12 5v14"/><path d="M5 12h14"/>
{%- elif name == 'minus' -%}
<path d="M5 12h14"/>
{%- elif name == 'edit' -%}
<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>
{%- elif name == 'trash' -%}
<path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M9 7V4h6v3"/>
{%- elif name == 'bolt' -%}
<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>
{%- elif name == 'bell' -%}
<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
{%- elif name == 'check' -%}
<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'alert' -%}
<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
{%- elif name == 'info' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
{%- elif name == 'chevron-left' -%}
<path d="m15 18-6-6 6-6"/>
{%- elif name == 'chevron-right' -%}
<path d="m9 18 6-6-6-6"/>
{%- elif name == 'sun' -%}
<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.9 19.1 1.4-1.4"/><path d="m17.7 6.3 1.4-1.4"/>
{%- elif name == 'moon' -%}
<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>
{%- elif name == 'save' -%}
<path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 3v5h8"/><path d="M7 21v-7h10v7"/>
{%- elif name == 'key' -%}
<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2"/><path d="m17 6 3 3"/><path d="m15 8 2 2"/>
{%- elif name == 'user' -%}
<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- endif -%}
</svg>
{%- endmacro %}

{#- Brand bolt: crisp vector version of the original gradient ⚡ -#}
{% macro logo_mark(uid='lm', size=28) -%}
<svg class="logo-bolt" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true">
<defs><linearGradient id="{{ uid }}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdf00"/><stop offset="1" stop-color="#f25622"/></linearGradient></defs>
<path d="M14.2 1.2 3.8 13.4h6.6l-1.6 9.4L20.2 9.9h-6.8l.8-8.7Z" fill="url(#{{ uid }})" stroke="url(#{{ uid }})" stroke-width="1" stroke-linejoin="round"/>
</svg>
{%- endmacro %}
