{% extends '_auth.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="lede">Log in to see today's usage and costs.</p>
<form id="login-form" method="POST" action="{{ url_for('access.login') }}">
    <div class="field">
        <label class="label" for="login-email">Email</label>
        <input class="input" type="email" id="login-email" name="email" autocomplete="email" required autofocus>
    </div>
    <div class="field">
        <label class="label" for="login-password">Password</label>
        <input class="input" type="password" id="login-password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn--primary btn--lg btn--block">Log in</button>
</form>
<p class="auth-switch">New to Volt Vortex? <a href="{{ url_for('access.register') }}">Create an account</a></p>
{% endblock %}
