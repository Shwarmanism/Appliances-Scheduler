{% extends '_auth.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
{% set f = form | default({}) %}
<h1>Create your account</h1>
<p class="lede">It takes a minute. Then add your first appliance.</p>
<form id="register-form" method="POST" action="{{ url_for('access.register') }}">
    <div class="field">
        <label class="label" for="register-name">Full name</label>
        <input class="input" type="text" id="register-name" name="fullname" value="{{ f.get('fullname', '') }}" autocomplete="name" required autofocus>
    </div>
    <div class="row" style="margin-top:16px">
        <div class="field">
            <label class="label" for="register-email">Email</label>
            <input class="input" type="email" id="register-email" name="email" value="{{ f.get('email', '') }}" autocomplete="email" required>
        </div>
        <div class="field">
            <label class="label" for="register-username">Username</label>
            <input class="input" type="text" id="register-username" name="username" value="{{ f.get('username', '') }}" autocomplete="username" required>
        </div>
    </div>
    <div class="field">
        <label class="label" for="register-password">Password</label>
        <input class="input" type="password" id="register-password" name="password" autocomplete="new-password" required>
    </div>
    <div class="field">
        <label class="label" for="register-confirm-password">Confirm password</label>
        <input class="input" type="password" id="register-confirm-password" name="verify_password" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn--primary btn--lg btn--block">Create account</button>
</form>
<p class="auth-switch">Already have an account? <a href="{{ url_for('access.login') }}">Log in</a></p>
{% endblock %}
